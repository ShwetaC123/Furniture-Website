<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Dome Furniture</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Design Dome Furniture</h1>
        <nav>
            <a href="F1.html">Home</a> |
            <a href="cart.html">View Cart</a> |
            <span>🛒 Cart Items: <span id="cart-count">0</span></span>
        </nav>

        <input type="text" id="search" placeholder="Search product..." oninput="searchProduct()">
    </header>


    <section id="product-list"></section>

    <div id="cart">
        <h2>Shopping Cart 🛒</h2>
        <ul id="cart-items"></ul>
        <p>Total: ₹<span id="cart-total">0</span></p>
        <button onclick="checkout()">Checkout</button>
    </div>
<footer>
    <p>&copy; 2025 Design Dome Furniture. All rights reserved.</p>
</footer>

    <script>
        const products = [
            { id: 1, name: "Wooden Chair", price: 1500, image: "chair.jpg" },
            { id: 2, name: "Luxury Sofa", price: 12000, image: "sofa.jpg" },
            { id: 3, name: "Dining Table", price: 8000, image: "table.jpg" },
            { id: 4, name: "Loop Table", price: 7800, image: "loop.jpg" },
            { id: 5, name: "Shelf Table", price: 5000, image: "shelf.jpg" },
            { id: 6, name: "Cabinet", price: 15000, image: "cabinet.jpg" }
        ];

        const productList = document.getElementById('product-list');
        const cartItems = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function displayProduct(product) {
            const div = document.createElement('div');
            div.className = 'product';
            div.innerHTML = `
        <img src="images/${product.image}" alt="${product.name}" width="150">
        <h3>${product.name}</h3>
        <p>Price: ₹${product.price}</p>
        <a href="product.html?id=${product.id}">View Details</a><br>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
    `;
            productList.appendChild(div);
        }


        function loadProducts() {
            productList.innerHTML = '';
            products.forEach(displayProduct);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }
        function updateCart() {
            cartItems.innerHTML = '';
            let total = 0;
            let totalQuantity = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalQuantity += item.quantity;
                const li = document.createElement('li');
                li.innerHTML = `
            ${item.name} - ₹${item.price} x ${item.quantity}
            <button onclick="changeQuantity(${item.id}, 1)">+</button>
            <button onclick="changeQuantity(${item.id}, -1)">-</button>
            <button onclick="removeItem(${item.id})">Remove</button>
        `;
                cartItems.appendChild(li);
            });

            cartTotal.textContent = total;
            document.getElementById('cart-count').textContent = totalQuantity;
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function removeItem(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Cart is empty!');
            } else {
                alert('Thank you for your purchase!');
                cart = [];
                updateCart();
                localStorage.removeItem('cart');
            }
        }

        function searchProduct() {
            const searchText = document.getElementById('search').value.toLowerCase();
            productList.innerHTML = '';
            products.filter(product => product.name.toLowerCase().includes(searchText))
                .forEach(displayProduct);
        }

        loadProducts();
        updateCart();
    </script>
    
</body>

</html>
