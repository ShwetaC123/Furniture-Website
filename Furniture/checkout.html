<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Design Dome Furniture</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Design Dome Furniture</h1>
        <nav>
            <a href="F1.html">Home</a> |
            <a href="cart.html">View Cart</a>
        </nav>
    </header>

    <section id="checkout-section">
        <h2>Checkout</h2>
        <form id="checkout-form">
            <label>Name:</label><br>
            <input type="text" id="name" required><br><br>

            <label>Address:</label><br>
            <textarea id="address" required></textarea><br><br>

            <label>Payment Method:</label><br>
            <select id="payment-method">
                <option value="cod">Cash on Delivery</option>
                <option value="upi">UPI</option>
                <option value="card">Credit/Debit Card</option>
            </select><br><br>

            <button type="submit">Place Order</button>
        </form>
    </section>

    <script>
        document.getElementById('checkout-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const address = document.getElementById('address').value.trim();
            const payment = document.getElementById('payment-method').value;

            if (!name || !address) {
                alert('Please fill all details.');
                return;
            }

            // Clear cart
            localStorage.removeItem('cart');

            alert(`Thank you ${name}! Your order has been placed via ${payment.toUpperCase()}.`);
            window.location.href = 'index.html';
        });
    </script>

</body>

</html>
